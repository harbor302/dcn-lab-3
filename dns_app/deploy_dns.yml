apiVersion: v1
kind: Namespace
metadata:
  name: dns-lab3
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: as-records
  namespace: dns-lab3
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: as
  namespace: dns-lab3
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dns-as
  template:
    metadata:
      labels:
        app: dns-as
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: as
          image: harbor302/dcn-lab3-as:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 53533
              protocol: UDP
          volumeMounts:
            - name: records
              mountPath: /data
      volumes:
        - name: records
          persistentVolumeClaim:
            claimName: as-records
---
apiVersion: v1
kind: Service
metadata:
  name: as
  namespace: dns-lab3
spec:
  type: NodePort
  selector:
    app: dns-as
  ports:
    - port: 53533
      targetPort: 53533
      nodePort: 30001
      protocol: UDP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fs
  namespace: dns-lab3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dns-fs
  template:
    metadata:
      labels:
        app: dns-fs
    spec:
      containers:
        - name: fs
          image: harbor302/dcn-lab3-fs:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet:
              path: /fibonacci?number=0
              port: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: fs
  namespace: dns-lab3
spec:
  type: NodePort
  selector:
    app: dns-fs
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30002
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: us
  namespace: dns-lab3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dns-us
  template:
    metadata:
      labels:
        app: dns-us
    spec:
      containers:
        - name: us
          image: harbor302/dcn-lab3-us:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: us
  namespace: dns-lab3
spec:
  type: NodePort
  selector:
    app: dns-us
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30003
      protocol: TCP
